name: Build iOS App (Cloud Mac)

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual 1-click trigger from GitHub web dashboard

jobs:
  build-ios:
    name: Build iOS with Apple Xcode
    runs-on: macos-14 # GitHub Apple Silicon (M1) Cloud Runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Bundle Clinical Simulators & Assets
        run: node bundle-assets.js

      - name: Sync iOS Capacitor Platform
        run: npx cap sync ios

      - name: Build iOS Simulator App (For Appetize.io & Simulators)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS Simulator' \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO
          
          # Compress the built .app for instant Appetize.io upload
          cd build/Build/Products/Release-iphonesimulator
          tar -czf "$GITHUB_WORKSPACE/CriticalCareHub-iOS-Simulator.tar.gz" App.app
          zip -r "$GITHUB_WORKSPACE/CriticalCareHub-iOS-Simulator.zip" App.app

      - name: Upload iOS Simulator Build (For Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: CriticalCareHub-iOS-Simulator
          path: |
            CriticalCareHub-iOS-Simulator.tar.gz
            CriticalCareHub-iOS-Simulator.zip
          retention-days: 14
